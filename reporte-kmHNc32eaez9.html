<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Reservas — CHECA</title>
<style>
  :root{
    --bg:#141210; --panel:#1c1917; --panel2:#221e1b; --border:#332c26;
    --gold:#c9a15a; --gold-soft:#8a713f; --text:#eee6da; --text-dim:#a89a86;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--text);
    font-family:Georgia,'Times New Roman',serif;
  }
  .wrap{max-width:1000px; margin:0 auto;}
  header{margin-bottom:28px; text-align:center;}
  header h1{
    margin:0 0 4px; font-size:1.9rem; letter-spacing:.06em;
    color:var(--gold); font-weight:normal; text-transform:uppercase;
  }
  header p{margin:0; color:var(--text-dim); font-size:.85rem;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:28px;}
  .kpi{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px;
  }
  .kpi .label{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .kpi .value{font-size:1.9rem; color:var(--gold); margin-top:6px;}
  .kpi .sub{font-size:.8rem; color:var(--text-dim); margin-top:4px;}
  .filters{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px 18px; margin-bottom:18px;
  }
  .filters label{font-size:.8rem; color:var(--text-dim);}
  .filters input[type=date]{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:inherit; font-size:.9rem;
  }
  .filters button{
    background:none; border:1px solid var(--gold-soft); color:var(--gold);
    border-radius:6px; padding:6px 12px; font-family:inherit; font-size:.8rem; cursor:pointer;
  }
  .filters button:hover{background:var(--gold-soft); color:var(--bg);}
  .filters button:disabled{opacity:.5; cursor:default;}
  .filters .spacer{flex:1;}
  #btnActualizar{border-color:var(--gold); color:var(--gold); font-weight:bold;}
  .meta-line{font-size:.8rem; color:var(--text-dim); margin:0 0 6px;}
  .estado-linea{font-size:.78rem; color:var(--text-dim); margin:0 0 10px; min-height:1.1em;}
  .estado-linea.error{color:#d98a8a;}
  .estado-linea.ok{color:#8fbf8f;}
  .table-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:10px;}
  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--panel2); color:var(--gold);
    font-weight:normal; text-transform:uppercase; letter-spacing:.05em; font-size:.72rem;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel2);}
  .obs{color:var(--text-dim); max-width:260px;}
  .empty{padding:28px; text-align:center; color:var(--text-dim);}
  .badge{
    display:inline-block; padding:1px 8px; border-radius:999px; font-size:.72rem;
    border:1px solid var(--gold-soft); color:var(--gold);
  }
  footer{text-align:center; margin-top:24px; font-size:.72rem; color:var(--text-dim);}

  @media (max-width:640px){
    body{padding:16px 10px 48px;}
    header h1{font-size:1.4rem;}
    .kpis{grid-template-columns:repeat(2,1fr); gap:10px;}
    .kpi{padding:14px 12px;}
    .kpi .value{font-size:1.5rem;}
    .filters{flex-direction:column; align-items:stretch; padding:14px;}
    .filters label{display:flex; justify-content:space-between; align-items:center; gap:8px;}
    .filters input[type=date]{flex:1; min-height:38px;}
    .filters button{width:100%; padding:10px 12px; min-height:40px;}
    .filters .spacer{display:none;}
    table{font-size:.82rem;}
    thead th, tbody td{padding:8px 8px;}
    .obs{max-width:140px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reservas — CHECA</h1>
    <p id="subtitulo">Cargando datos…</p>
  </header>

  <div class="kpis">
    <div class="kpi">
      <div class="label">Reservas hoy</div>
      <div class="value" id="kpiCantHoy">—</div>
      <div class="sub" id="kpiCantHoySub">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label">Personas hoy</div>
      <div class="value" id="kpiHoy">—</div>
      <div class="sub" id="kpiHoySub">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label">Ubicación hoy</div>
      <div class="value" id="kpiUbicacion" style="font-size:1.2rem;">—</div>
      <div class="sub">Adentro / Afuera</div>
    </div>
    <div class="kpi">
      <div class="label">Reservas mañana</div>
      <div class="value" id="kpiCantManana">—</div>
      <div class="sub" id="kpiCantMananaSub">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label">Personas mañana</div>
      <div class="value" id="kpiManana">—</div>
      <div class="sub" id="kpiMananaSub">&nbsp;</div>
    </div>
  </div>

  <div class="filters">
    <label>Desde <input type="date" id="desde"></label>
    <label>Hasta <input type="date" id="hasta"></label>
    <button id="btnHoy" type="button">Hoy</button>
    <button id="btn7">Próximos 7 días</button>
    <button id="btnTodo" type="button">Ver todo</button>
    <span class="spacer"></span>
    <button id="btnActualizar" type="button">🔄 Actualizar datos</button>
  </div>

  <p class="estado-linea" id="estadoActualizacion">&nbsp;</p>
  <p class="meta-line" id="metaLine">&nbsp;</p>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Hora</th><th>Nombre</th><th>Personas</th><th>Ubicación</th><th>Observación</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxQLtfPShaxuomqUOY-zKtzNDrck3_JCkOwe6oECgdrf_KqSkaqRZhambWe3byNH5nB/exec";
const KEY_STORAGE = "checa_reporte_clave";
let claveActual = null;
// La clave llega una sola vez en el link (después del #), se guarda en este navegador
// y se saca de la barra de direcciones. NO está escrita en este archivo.
function leerClave(){
  if(claveActual) return claveActual;
  let clave = '';
  const hash = (location.hash || '').replace(/^#/, '');
  if(hash){
    try { clave = decodeURIComponent(hash); } catch(e) { clave = hash; }
    try { localStorage.setItem(KEY_STORAGE, clave); } catch(e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  } else {
    try { clave = localStorage.getItem(KEY_STORAGE) || ''; } catch(e) {}
  }
  claveActual = clave;
  return clave;
}
function borrarClave(){
  claveActual = null;
  try { localStorage.removeItem(KEY_STORAGE); } catch(e) {}
}

let RESERVAS = [];
let activas = [];

function ymd(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function esCancelada(estado){ return (estado||'').toLowerCase().includes('cancel'); }
function fechaLegible(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function normFecha(f){
  f = (f||'').trim();
  if(!f) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const m = f.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){ const [,d,mo,y] = m; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return f;
}

const hoy = new Date(); hoy.setHours(0,0,0,0);
const hoyStr = ymd(hoy);
const mananaStr = ymd(addDays(hoy,1));

function sumPersonas(fecha){
  return activas.filter(r=>r.fecha===fecha).reduce((a,r)=>a+(r.personas||0),0);
}
function contarReservas(fecha){
  return activas.filter(r=>r.fecha===fecha).length;
}
function porUbicacion(fecha){
  const rows = activas.filter(r=>r.fecha===fecha);
  const dentro = rows.filter(r=>r.ubicacion==='Adentro').reduce((a,r)=>a+(r.personas||0),0);
  const fuera = rows.filter(r=>r.ubicacion==='Afuera').reduce((a,r)=>a+(r.personas||0),0);
  return {dentro, fuera};
}

function actualizarKpis(){
  document.getElementById('kpiCantHoy').textContent = contarReservas(hoyStr);
  document.getElementById('kpiCantHoySub').textContent = fechaLegible(hoyStr);
  document.getElementById('kpiHoy').textContent = sumPersonas(hoyStr);
  document.getElementById('kpiHoySub').textContent = fechaLegible(hoyStr);
  document.getElementById('kpiManana').textContent = sumPersonas(mananaStr);
  document.getElementById('kpiMananaSub').textContent = fechaLegible(mananaStr);
  document.getElementById('kpiCantManana').textContent = contarReservas(mananaStr);
  document.getElementById('kpiCantMananaSub').textContent = fechaLegible(mananaStr);
  const ub = porUbicacion(hoyStr);
  document.getElementById('kpiUbicacion').textContent = `${ub.dentro} · ${ub.fuera}`;
}

const desdeInput = document.getElementById('desde');
const hastaInput = document.getElementById('hasta');
const tbody = document.getElementById('tbody');
const metaLine = document.getElementById('metaLine');
const estadoActualizacion = document.getElementById('estadoActualizacion');
const btnActualizar = document.getElementById('btnActualizar');

function render(){
  const desde = desdeInput.value;
  const hasta = hastaInput.value;
  let rows = activas.filter(r => {
    if(desde && r.fecha < desde) return false;
    if(hasta && r.fecha > hasta) return false;
    return true;
  });
  rows.sort((a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora));

  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="empty">No hay reservas en ese rango de fechas.</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${escapeHtml(fechaLegible(r.fecha))}</td>
        <td>${escapeHtml(r.hora||'')}</td>
        <td>${escapeHtml(r.nombre)}</td>
        <td>${r.personas||0}</td>
        <td>${r.ubicacion?`<span class="badge">${escapeHtml(r.ubicacion)}</span>`:''}</td>
        <td class="obs">${escapeHtml(r.obs)}</td>
      </tr>
    `).join('');
  }
  const totalPersonas = rows.reduce((a,r)=>a+(r.personas||0),0);
  metaLine.textContent = `${rows.length} reserva(s) · ${totalPersonas} persona(s) en el rango seleccionado`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filasDesdeApi(rows){
  return (Array.isArray(rows) ? rows : []).map(r => ({
    fecha: normFecha(String(r.fecha || '')),
    hora: String(r.hora || '').trim(),
    nombre: String(r.nombre || '').trim(),
    personas: parseInt(r.personas, 10) || 0,
    ubicacion: String(r.ubicacion || '').trim(),
    estado: String(r.estado || '').trim(),
    obs: String(r.obs || '').trim(),
  }));
}

function aplicarDatos(nuevaLista){
  RESERVAS = nuevaLista;
  activas = RESERVAS.filter(r => r.fecha && !esCancelada(r.estado));
  actualizarKpis();
  render();
}

async function actualizarDatos(){
  btnActualizar.disabled = true;
  const textoOriginal = btnActualizar.textContent;
  btnActualizar.textContent = 'Actualizando…';
  estadoActualizacion.className = 'estado-linea';
  estadoActualizacion.textContent = 'Buscando datos actuales…';
  try {
    const clave = leerClave();
    if(!clave) throw new Error('falta la clave de acceso');
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'report', key: clave })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!data || data.success !== true){
      if(data && data.error === 'No autorizado'){ borrarClave(); throw new Error('clave incorrecta'); }
      throw new Error('el servidor no devolvió los datos');
    }
    aplicarDatos(filasDesdeApi(data.rows));
    const ahora = new Date().toLocaleString('es-AR');
    document.getElementById('subtitulo').textContent = `Datos actualizados en vivo: ${ahora}`;
    estadoActualizacion.className = 'estado-linea ok';
    estadoActualizacion.textContent = `Actualizado: ${ahora}`;
  } catch(err){
    document.getElementById('subtitulo').textContent = 'Sin datos';
    estadoActualizacion.className = 'estado-linea error';
    estadoActualizacion.textContent = 'No se pudo cargar (' + err.message + '). Pedí el link completo del reporte (con la clave) a quien lo administra.';
  } finally {
    btnActualizar.disabled = false;
    btnActualizar.textContent = textoOriginal;
  }
}

document.getElementById('btnHoy').addEventListener('click', () => {
  desdeInput.value = hoyStr; hastaInput.value = hoyStr; render();
});
document.getElementById('btn7').addEventListener('click', () => {
  desdeInput.value = hoyStr; hastaInput.value = ymd(addDays(hoy,7)); render();
});
document.getElementById('btnTodo').addEventListener('click', () => {
  desdeInput.value = hoyStr; hastaInput.value = ''; render();
});
btnActualizar.addEventListener('click', actualizarDatos);
desdeInput.addEventListener('change', render);
hastaInput.addEventListener('change', render);

desdeInput.value = hoyStr;
hastaInput.value = ymd(addDays(hoy,7));
aplicarDatos(RESERVAS);
actualizarDatos();
</script>
</body>
</html>
